name: auto_edit
description: "Auto-Edit: o app que dirige o motor de edição."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  auto_edit_client:
    path: ../packages/auto_edit_client
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  qr_flutter: ^4.1.0
  http: ^1.2.0
  mobile_scanner: ^7.5.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  flutter_secure_storage: ^11.2.0
  nsd: ^5.0.1
  flutter_local_notifications: ^22.0.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
