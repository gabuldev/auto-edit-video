name: App (Flutter)

# The Flutter app (app/: desktop, and the phone as a remote) and what it
# builds on: the Dart client and the contract it is generated from.
on:
  pull_request:
    branches: [main]
    paths: ["app/**", "packages/**", "auto_edit/openapi.yaml", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "packages/**", "auto_edit/openapi.yaml", ".github/workflows/app.yml"]

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # engine_integration_test starts a real `auto-edit serve`
      - name: Install the engine
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
        env:
          AUTO_EDIT_BIN: auto-edit

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          # The phone (#147): built to catch breakage, unsigned. TestFlight
          # and Play need the store accounts.
          - os: ubuntu-latest
            target: apk
            args: --debug
          - os: macos-latest
            target: ios
            args: --no-codesign
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libsecret-1-dev

      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} ${{ matrix.args || '--release' }}
