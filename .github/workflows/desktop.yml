name: Desktop app

# Builds the Tauri app on macOS (Apple Silicon), Windows and Linux.
# No Intel Mac build: the Python packages the engine needs (llvmlite,
# cryptography, torch) no longer publish macOS x86_64 wheels — Intel Macs use
# the CLI.
#
# - Called by release.yml after it tags a version: the installers are attached
#   to that GitHub release (`tag` input).
# - On a pull request that touches the app or this workflow: same builds, no
#   upload — the build is checked before it can break a release.
# - By hand (Actions → Desktop app → Run workflow) to (re)build a tag.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach to, e.g. v0.30.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to, e.g. v0.30.0"
        required: true
        type: string
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - "scripts/sync_desktop_version.py"
      - "scripts/stage_engine.py"
      - "scripts/smoke_engine.py"
      - "scripts/sign_macos_engine.py"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # No AppImage: linuxdeploy spent 2h+ walking the thousands of
            # shared objects in the embedded Python/torch and then failed.
            bundles: --bundles deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag }}
      PYTHONUTF8: "1"  # Windows runners default to cp1252
      # macOS releases are signed with a Developer ID and notarized; the Apple
      # secrets live in Doppler (see docs/macos-signing.md). Without
      # DOPPLER_TOKEN, and on pull requests, ad-hoc signed.
      NOTARIZE: ${{ inputs.tag != '' && secrets.DOPPLER_TOKEN != '' && startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stamp the app with the release version
        shell: bash
        run: python scripts/sync_desktop_version.py "${TAG:-}"

      - name: Stage the embedded engine (portable Python + auto-edit + FFmpeg)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stage_engine.py --target ${{ matrix.target }} --out desktop/src-tauri/engine

      - name: Fetch the Apple secrets from Doppler (macOS release)
        if: env.NOTARIZE == 'true'
        uses: dopplerhq/secrets-fetch-action@v1.3.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true  # masked in the logs

      - name: Import the Developer ID certificate (macOS release)
        if: env.NOTARIZE == 'true'
        shell: bash
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -n "${!v:-}" ] || { echo "::error::$v missing in Doppler (the DOPPLER_TOKEN config)"; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -A
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          # Notarization (App Store Connect API key) — read by the Tauri bundler.
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Sign the engine's binaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Every Mach-O inside the app must be signed with hardened runtime for
        # notarization; signed before the smoke test so it runs what ships.
        run: python scripts/sign_macos_engine.py desktop/src-tauri/engine --identity "${APPLE_SIGNING_IDENTITY:--}"

      - name: Smoke-test the engine as the installed app runs it
        shell: bash
        run: python scripts/smoke_engine.py desktop/src-tauri/engine

      - name: Install the Tauri CLI and generate icons
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx tauri icon app-icon.png

      - name: Build (no upload)
        if: inputs.tag == ''
        working-directory: desktop
        shell: bash
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.engine.conf.json ${{ matrix.bundles }}

      - name: Release id
        if: inputs.tag != ''
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

      - name: Build and attach to the release
        if: inputs.tag != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ steps.rel.outputs.id }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.engine.conf.json ${{ matrix.bundles }}
