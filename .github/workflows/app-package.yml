name: App (Flutter) packages

# The Flutter app (app/) packaged with the embedded engine, the way the Tauri
# app ships today (desktop.yml): a portable Python with auto-edit, the
# pipeline files, FFmpeg with libass and the renderer, staged by
# scripts/stage_engine.py into the bundle's `engine/` (lib/engine/locator.dart
# finds it there).
#
# Part 1 of #144: the packages are built and smoke-tested, and kept as the
# run's artifacts. They are NOT attached to releases yet and there is no
# in-app update: switching people from Tauri to Flutter is a separate step.
#
# - On a pull request that touches the packaging: the same builds, as a check.
# - By hand (Actions → App (Flutter) packages → Run workflow).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/app-package.yml"
      - "app/macos/**"
      - "app/windows/**"
      - "app/linux/**"
      - "app/lib/engine/**"
      - "scripts/stage_engine.py"
      - "scripts/smoke_engine.py"
      - "scripts/sign_macos_engine.py"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            flutter: macos
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            flutter: windows
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            flutter: linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # Windows runners default to cp1252
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build the app
        working-directory: app
        run: |
          flutter pub get
          flutter build ${{ matrix.flutter }} --release

      - name: Where the bundle is
        id: bundle
        shell: bash
        run: |
          case "${{ matrix.flutter }}" in
            macos)   dir="app/build/macos/Build/Products/Release/Auto-Edit.app"; res="$dir/Contents/Resources" ;;
            windows) dir="app/build/windows/x64/runner/Release"; res="$dir" ;;
            linux)   dir="app/build/linux/x64/release/bundle"; res="$dir" ;;
          esac
          test -d "$dir" || { echo "::error::no bundle at $dir"; ls -R app/build | head -50; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "engine=$res/engine" >> "$GITHUB_OUTPUT"

      - name: Stage the embedded engine into the bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stage_engine.py --target ${{ matrix.target }} --out "${{ steps.bundle.outputs.engine }}"

      - name: Sign the engine's binaries and the app (macOS, ad hoc)
        if: runner.os == 'macOS'
        shell: bash
        # Developer ID signing and notarization come with the release step;
        # ad hoc here so the smoke test runs what would ship.
        run: |
          python scripts/sign_macos_engine.py "${{ steps.bundle.outputs.engine }}" --identity -
          codesign --force --deep --sign - "${{ steps.bundle.outputs.dir }}"

      - name: Smoke-test the engine as the installed app runs it
        shell: bash
        run: python scripts/smoke_engine.py "${{ steps.bundle.outputs.engine }}"

      - name: Package
        id: pkg
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.flutter }}" in
            macos)
              out="dist/Auto-Edit-macos-arm64.dmg"
              hdiutil create -volname "Auto-Edit" -srcfolder "${{ steps.bundle.outputs.dir }}" -ov -format UDZO "$out" ;;
            windows)
              out="dist/Auto-Edit-windows-x64.zip"
              (cd "${{ steps.bundle.outputs.dir }}" && 7z a -tzip -mx=5 "$GITHUB_WORKSPACE/$out" . > /dev/null) ;;
            linux)
              out="dist/Auto-Edit-linux-x64.tar.gz"
              tar -C "$(dirname "${{ steps.bundle.outputs.dir }}")" -czf "$out" --transform 's,^bundle,Auto-Edit,' bundle ;;
          esac
          ls -la dist
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flutter }}
          path: ${{ steps.pkg.outputs.file }}
          retention-days: 14
